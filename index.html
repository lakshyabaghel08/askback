<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskBack - Dashboard</title>
  <style>
    /* 
      Premium Academic Study Tool Theme
      Clean, minimal, high-readability with generous whitespace and soft geometry.
      Gloomy gradients are strictly avoided.
    */
    :root {
      /* Color Palette */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      --brand-primary: #1e293b;
      --brand-hover: #0f172a;
      --brand-accent: #3b82f6; /* Subtle accent for active elements */
      
      --border-light: #e2e8f0;
      
      --status-success-bg: #f0fdf4;
      --status-success-text: #166534;
      
      --status-pending-bg: #fffbeb;
      --status-pending-text: #b45309;

      /* Metrics */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      
      --transition-fast: 0.15s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .hidden {
      display: none !important;
    }

    /* Layout */
    #app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 0 var(--spacing-lg);
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--text-primary);
      line-height: 1.3;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: var(--spacing-md);
    }
    
    h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--spacing-sm);
    }

    /* Header & Navigation */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) 0;
    }

    .brand-area {
      display: flex;
      flex-direction: column;
    }

    .brand-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-area .tagline {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .app-nav {
      display: flex;
      gap: var(--spacing-xl);
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .app-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--spacing-md) 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color var(--transition-fast);
    }

    .nav-tab:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .nav-tab.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .btn-primary {
      background-color: var(--brand-primary);
      color: #fff;
    }

    .btn-primary:hover {
      background-color: var(--brand-hover);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    .btn-secondary:hover {
      background-color: var(--bg-subtle);
    }
    
    .btn-text {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .btn-text:hover {
      color: var(--text-primary);
    }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xl);
      padding: var(--spacing-lg);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    /* Dashboard Layout */
    .main-content {
      flex-grow: 1;
      padding: var(--spacing-xl) 0 64px 0;
    }

    .section-block {
      margin-bottom: var(--spacing-xl);
    }

    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--spacing-lg);
    }

    /* User Cards */
    .user-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--border-light);
    }

    .user-card-header h4 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0;
    }

    .badge-notification {
      background-color: var(--status-pending-bg);
      color: var(--status-pending-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid #fde68a;
      transition: background-color var(--transition-fast);
    }
    
    .badge-notification:hover {
      background-color: #fef3c7;
    }

    /* Goal Lists */
    .goal-list {
      list-style: none;
      margin-bottom: var(--spacing-md);
      flex-grow: 1;
    }

    .goal-item {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
      font-size: 0.9375rem;
      transition: color var(--transition-fast);
    }

    /* Real Interactive Checkboxes */
    .goal-checkbox {
      width: 16px;
      height: 16px;
      margin-top: 4px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--status-success-text);
    }
    
    .goal-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    /* Mock Checkbox for Tomorrow (Non-interactive) */
    .checkbox-mock {
      width: 16px;
      height: 16px;
      border: 1px solid var(--text-tertiary);
      border-radius: 4px;
      margin-top: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .goal-item.completed {
      color: var(--text-secondary);
      text-decoration: line-through;
      text-decoration-color: var(--border-light);
    }

    /* Stats Block */
    .stats-block {
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      padding: var(--spacing-md);
      margin-top: auto;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: 0.875rem;
    }
    
    .stat-row:last-child {
      margin-bottom: 0;
    }

    .stat-label {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-value {
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .note-text {
      margin-top: var(--spacing-sm);
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-style: italic;
      border-left: 2px solid var(--border-light);
      padding-left: var(--spacing-sm);
    }

    /* Utilities */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-tertiary);
      font-size: 0.9375rem;
      font-weight: 500;
    }
    
    .loading-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-secondary);
      font-size: 1rem;
    }
    
    .message.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: var(--radius-sm);
    }

    /* User Selection Screen */
    #view-select-user {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-body);
      padding: var(--spacing-xl);
    }
    
    .select-user-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .user-btn {
      display: block;
      width: 100%;
      margin-bottom: var(--spacing-md);
      padding: 16px;
      font-size: 1rem;
      border-radius: var(--radius-sm);
    }

    @media (max-width: 640px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-md);
      }
      .quick-actions {
        flex-direction: column;
      }
      .quick-actions .btn {
        width: 100%;
      }
      .users-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- SELECT USER VIEW -->
  <div id="view-select-user" class="hidden">
    <div class="select-user-card">
      <h1 style="font-size: 2rem; letter-spacing: -0.025em; margin-bottom: 4px;">AskBack</h1>
      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;">Ask. Recall. Answer.</div>
      <h2 style="font-size: 1rem; color: var(--text-secondary); font-weight: 500;">Who is studying today?</h2>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Lakshya')">Lakshya</button>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Archita')">Archita</button>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="app-shell" class="hidden">
    
    <header class="app-header">
      <div class="container">
        <div class="header-top">
          <div class="brand-area">
            <h1>AskBack</h1>
            <div class="tagline">Ask. Recall. Answer.</div>
          </div>
          <div class="user-area">
            <span id="header-current-user"></span>
            <button class="btn-text" onclick="app.switchUser()">Switch User</button>
          </div>
        </div>
        <nav class="app-nav">
          <button class="nav-tab active">Dashboard</button>
          <button class="nav-tab" onclick="app.placeholderNav('Goals')">Daily Goals</button>
          <button class="nav-tab" onclick="app.placeholderNav('Question Exchange')">Question Exchange</button>
          <button class="nav-tab" onclick="app.placeholderNav('History')">History</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        
        <!-- QUICK ACTIONS -->
        <div class="quick-actions">
          <button class="btn btn-primary" onclick="app.placeholderAction('Set Tomorrow\\'s Goals')">Set Tomorrow's Goals</button>
          <button class="btn btn-secondary" onclick="app.placeholderAction('Log Today\\'s Study')">Log Today's Study</button>
          <button class="btn btn-secondary" onclick="app.placeholderAction('Ask a Question')">Ask a Question</button>
          <button class="btn btn-secondary" onclick="app.placeholderAction('Answer Pending Questions')">Answer Pending Questions</button>
        </div>

        <div id="dashboard-loading" class="loading-state">Loading Dashboard Data...</div>
        
        <div id="dashboard-content" class="hidden">
          <!-- TODAY SECTION -->
          <div class="section-block">
            <h2>Today's Overview</h2>
            <h3 id="today-date-label"></h3>
            <div class="users-grid" id="today-grid">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- TOMORROW SECTION -->
          <div class="section-block" style="margin-top: 48px;">
            <h2>Tomorrow's Plan</h2>
            <h3 id="tomorrow-date-label"></h3>
            <div class="users-grid" id="tomorrow-grid">
              <!-- Rendered via JS -->
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // Reusable API JSONP Layer exactly as designed for Apps Script
    const apiLayer = {
      baseUrl: 'https://script.google.com/macros/s/AKfycbwZdsLkAtPNy7oA5X8UyOHgqctSigR0Vb635Dac3lrSE69AfucLOKrhALKLGUDcL3nV/exec',
      
      request(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random()) + '_' + Date.now();
          const script = document.createElement('script');
          
          let url = `${this.baseUrl}?action=${encodeURIComponent(action)}&callback=${callbackName}`;
          for (const key in params) {
            url += `&${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`;
          }
          
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('Request timed out after 15 seconds.'));
          }, 15000);
          
          window[callbackName] = (data) => {
            cleanup();
            if (data && data.success === false) {
              reject(new Error(data.error || data.message || 'API responded with an error.'));
            } else {
              resolve(data);
            }
          };
          
          script.onerror = () => {
            cleanup();
            reject(new Error('Network error or script blocked.'));
          };
          
          function cleanup() {
            clearTimeout(timeout);
            if (script.parentNode) script.parentNode.removeChild(script);
            delete window[callbackName];
          }
          
          script.src = url;
          document.head.appendChild(script);
        });
      }
    };

    const app = {
      currentUser: null,
      users: ["Lakshya", "Archita"],
      currentDashboardData: null, // Cache data to update UI dynamically
      
      init() {
        const savedUser = localStorage.getItem('askback_user');
        if (savedUser && this.users.includes(savedUser)) {
          this.currentUser = savedUser;
          this.showApp();
        } else {
          this.showSelectUser();
        }
      },

      // Utility: HTML Escaping
      escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
          tag => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              "'": '&#39;',
              '"': '&quot;'
            }[tag] || tag)
        );
      },

      // Date Formatting
      formatDateFriendly(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return this.escapeHTML(dateString);
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        return date.toLocaleDateString('en-GB', options);
      },

      // Navigation & State
      showSelectUser() {
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('view-select-user').classList.remove('hidden');
      },

      showApp() {
        document.getElementById('view-select-user').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        document.getElementById('header-current-user').textContent = this.currentUser;
        this.loadDashboard();
      },

      selectUser(username) {
        this.currentUser = username;
        localStorage.setItem('askback_user', username);
        this.showApp();
      },

      switchUser() {
        this.currentUser = null;
        localStorage.removeItem('askback_user');
        this.showSelectUser();
      },

      placeholderAction(actionName) {
        alert(`Quick Action: "${actionName}" will be implemented in the next stage.`);
      },

      placeholderNav(navName) {
        alert(`Navigation: "${navName}" section will be built in a future stage. Stay on Dashboard for now.`);
      },

      // API Data Fetching & Rendering
      async loadDashboard() {
        const loadingEl = document.getElementById('dashboard-loading');
        const contentEl = document.getElementById('dashboard-content');
        
        loadingEl.classList.remove('hidden');
        contentEl.classList.add('hidden');

        try {
          // Fetch the main dashboard data and individual pending counts in parallel
          const [dashRes, lakshyaCountRes, architaCountRes] = await Promise.all([
            apiLayer.request('dashboard'),
            apiLayer.request('count', { user: 'Lakshya' }),
            apiLayer.request('count', { user: 'Archita' })
          ]);

          this.currentDashboardData = dashRes.dashboard;
          const pendingCounts = {
            Lakshya: lakshyaCountRes.count || 0,
            Archita: architaCountRes.count || 0
          };

          this.renderDashboard(this.currentDashboardData, pendingCounts);
          
          loadingEl.classList.add('hidden');
          contentEl.classList.remove('hidden');

        } catch (error) {
          loadingEl.textContent = 'Failed to load dashboard. Please try refreshing.';
          loadingEl.style.color = '#991b1b';
          console.error("Dashboard Load Error:", error);
        }
      },

      renderDashboard(data, pendingCounts) {
        // Render Today
        document.getElementById('today-date-label').textContent = this.formatDateFriendly(data.today.date);
        const todayGrid = document.getElementById('today-grid');
        todayGrid.innerHTML = '';
        
        // Render Tomorrow
        document.getElementById('tomorrow-date-label').textContent = this.formatDateFriendly(data.tomorrow.date);
        const tomorrowGrid = document.getElementById('tomorrow-grid');
        tomorrowGrid.innerHTML = '';

        this.users.forEach(user => {
          // Construct Today Card
          const todayData = data.today.users[user];
          const count = pendingCounts[user];
          todayGrid.innerHTML += this.buildTodayCard(user, todayData, count);

          // Construct Tomorrow Card
          const tomorrowData = data.tomorrow.users[user];
          tomorrowGrid.innerHTML += this.buildTomorrowCard(user, tomorrowData);
        });
      },

      buildTodayCard(user, data, pendingCount) {
        const badgeHtml = pendingCount > 0 
          ? `<div class="badge-notification" onclick="app.placeholderNav('Question Exchange')">${pendingCount} Pending Questions</div>` 
          : '';

        let goalsHtml = '<div class="empty-state">No goals set for today.</div>';
        if (data.goals && data.goals.length > 0) {
          goalsHtml = '<ul class="goal-list">';
          data.goals.forEach(g => {
            const isCompletedClass = g.completed ? 'completed' : '';
            const isCheckedAttr = g.completed ? 'checked' : '';
            
            goalsHtml += `
              <li id="goal-item-${g.id}" class="goal-item ${isCompletedClass}">
                <input type="checkbox" id="goal-chk-${g.id}" class="goal-checkbox" ${isCheckedAttr} 
                       onchange="app.toggleGoal('${g.id}', '${user}', this.checked)">
                <span>${this.escapeHTML(g.goal)}</span>
              </li>
            `;
          });
          goalsHtml += '</ul>';
        }

        const studyHours = data.studyHours !== null ? `${data.studyHours} hrs` : '--';
        const noteHtml = data.note ? `<div class="note-text">"${this.escapeHTML(data.note)}"</div>` : '';

        return `
          <div class="user-card">
            <div class="user-card-header">
              <h4>${user}</h4>
              ${badgeHtml}
            </div>
            ${goalsHtml}
            <div class="stats-block">
              <div class="stat-row">
                <span class="stat-label">Goals Completed</span>
                <span class="stat-value" id="stats-completed-${user}">${data.completion.completed} / ${data.completion.total}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Study Hours</span>
                <span class="stat-value">${studyHours}</span>
              </div>
              ${noteHtml}
            </div>
            <div id="goal-error-${user}" class="message error hidden" style="margin-top: 12px; font-size: 0.875rem; padding: 8px;"></div>
          </div>
        `;
      },

      buildTomorrowCard(user, data) {
        let goalsHtml = '<div class="empty-state">No goals set for tomorrow yet.</div>';
        let targetCount = 0;
        
        if (data.goals && data.goals.length > 0) {
          targetCount = data.goals.length;
          goalsHtml = '<ul class="goal-list">';
          data.goals.forEach(g => {
            goalsHtml += `
              <li class="goal-item" style="color: var(--text-secondary);">
                <div class="checkbox-mock" style="border-style: dashed;"></div>
                <span>${this.escapeHTML(g.goal)}</span>
              </li>
            `;
          });
          goalsHtml += '</ul>';
        }

        return `
          <div class="user-card">
            <div class="user-card-header">
              <h4>${user}</h4>
              <span style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500;">
                ${targetCount} Target${targetCount !== 1 ? 's' : ''}
              </span>
            </div>
            ${goalsHtml}
          </div>
        `;
      },

      // Interaction: Toggle Goal Completion
      async toggleGoal(goalId, cardUser, isCompleted) {
        const chk = document.getElementById(`goal-chk-${goalId}`);
        const listItem = document.getElementById(`goal-item-${goalId}`);
        const errorDiv = document.getElementById(`goal-error-${cardUser}`);
        const statsSpan = document.getElementById(`stats-completed-${cardUser}`);

        // Temporarily disable while API request runs
        chk.disabled = true;
        if (errorDiv) errorDiv.classList.add('hidden');

        try {
          // Perform API request using the logged in user as the initiator
          await apiLayer.request('completeGoal', {
            id: goalId,
            user: this.currentUser, 
            completed: String(isCompleted)
          });

          // Optimistically update internal cached state
          if (this.currentDashboardData && this.currentDashboardData.today.users[cardUser]) {
            const userData = this.currentDashboardData.today.users[cardUser];
            const targetGoal = userData.goals.find(g => g.id === goalId);
            
            if (targetGoal) {
              targetGoal.completed = isCompleted;
            }

            // Recalculate and update the UI stats block
            const completedCount = userData.goals.filter(g => g.completed).length;
            userData.completion.completed = completedCount;
            
            if (statsSpan) {
              statsSpan.textContent = `${completedCount} / ${userData.completion.total}`;
            }
          }

          // Visually cross off the item
          if (isCompleted) {
            listItem.classList.add('completed');
          } else {
            listItem.classList.remove('completed');
          }

        } catch (error) {
          // Failure: Restore previous state
          chk.checked = !isCompleted; 
          if (errorDiv) {
            errorDiv.textContent = error.message;
            errorDiv.classList.remove('hidden');
          }
        } finally {
          // Always re-enable the checkbox
          chk.disabled = false;
        }
      }
    };

    // Boot app
    app.init();
  </script>
</body>
</html>
