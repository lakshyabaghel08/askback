<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskBack - Ask. Recall. Answer.</title>
  <style>
    /* 
      Premium Academic Study Tool Theme
      Clean, minimal, high-readability with generous whitespace and soft geometry.
    */
    :root {
      /* Color Palette */
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      --brand-primary: #1e293b;
      --brand-hover: #0f172a;
      
      --border-light: #e2e8f0;
      --border-focus: #94a3b8;
      
      --status-success-bg: #f0fdf4;
      --status-success-text: #166534;
      --status-success-border: #bbf7d0;
      
      --status-error-bg: #fef2f2;
      --status-error-text: #991b1b;
      --status-error-border: #fecaca;
      
      --status-pending-bg: #fffbeb;
      --status-pending-text: #92400e;
      --status-pending-border: #fde68a;

      /* Metrics */
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
      
      --transition-fast: 0.15s ease-in-out;
      --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .hidden {
      display: none !important;
    }

    /* Layout */
    #app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      padding: 0 var(--spacing-lg);
    }

    /* Typography */
    h1, h2, h3 {
      color: var(--text-primary);
      line-height: 1.3;
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    /* Header & Navigation */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) 0;
    }

    .brand-area {
      display: flex;
      flex-direction: column;
    }

    .brand-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-area .tagline {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .app-nav {
      display: flex;
      gap: var(--spacing-xl);
      overflow-x: auto;
      scrollbar-width: none; /* Firefox */
    }
    
    .app-nav::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--spacing-md) 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .nav-tab.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      height: 18px;
      min-width: 18px;
      padding: 0 5px;
      border-radius: 9px;
      transition: opacity var(--transition-fast);
    }

    .badge.empty {
      background: var(--border-light);
      color: var(--text-secondary);
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      padding: var(--spacing-xl) 0 64px 0;
    }
    
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: var(--spacing-lg);
      flex-wrap: wrap;
      gap: var(--spacing-md);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--border-light);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--brand-primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--brand-hover);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-subtle);
      border-color: var(--border-focus);
    }

    .btn-text {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .btn-text:hover:not(:disabled) {
      color: var(--text-primary);
    }

    /* Form Elements */
    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .form-static {
      font-size: 1rem;
      color: var(--text-secondary);
      padding: var(--spacing-sm) 0;
      border-bottom: 1px solid var(--border-light);
    }

    .form-input {
      width: 100%;
      font-family: inherit;
      padding: 12px 16px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }
    
    .form-input::placeholder {
      color: var(--text-tertiary);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 1px var(--brand-primary);
    }

    textarea.form-input {
      resize: vertical;
      min-height: 120px;
      line-height: 1.5;
    }

    .form-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-sm);
    }

    /* Cards */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-lg);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition-smooth);
      display: flex;
      flex-direction: column;
    }
    
    .card:hover {
      box-shadow: var(--shadow-md);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--spacing-md);
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }
    
    .card-header-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }

    .badge-subject {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--brand-primary);
      background-color: var(--bg-subtle);
      padding: 4px 10px;
      border-radius: 4px;
    }

    .card-meta {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .card-body {
      flex-grow: 1;
    }

    .question-text {
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: var(--spacing-md);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
    }

    .card-actions {
      margin-top: auto;
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--bg-body);
      display: flex;
      justify-content: flex-end;
    }
    
    /* Answer Display (History) */
    .answer-display {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background-color: var(--bg-body);
      border-left: 3px solid var(--border-light);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    
    .answer-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    
    .answer-text {
      font-size: 0.9375rem;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Answer Inline Box */
    .answer-box-inline {
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border-light);
      animation: fadeIn var(--transition-fast);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .answer-box-actions {
      margin-top: var(--spacing-md);
      display: flex;
      gap: var(--spacing-sm);
      justify-content: flex-end;
    }

    /* Status Badges */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }
    
    .status-badge.answered {
      background: var(--status-success-bg);
      color: var(--status-success-text);
      border: 1px solid var(--status-success-border);
    }
    
    .status-badge.pending {
      background: var(--status-pending-bg);
      color: var(--status-pending-text);
      border: 1px solid var(--status-pending-border);
    }

    /* Messages & States */
    .message {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: var(--spacing-lg);
      font-size: 0.875rem;
      font-weight: 500;
      display: none;
    }

    .message.success {
      display: block;
      background-color: var(--status-success-bg);
      color: var(--status-success-text);
      border: 1px solid var(--status-success-border);
    }
    
    .message.error {
      display: block;
      background-color: var(--status-error-bg);
      color: var(--status-error-text);
      border: 1px solid var(--status-error-border);
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      background: var(--bg-surface);
      border: 1px dashed var(--border-focus);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }

    /* User Selection Screen */
    #view-select-user {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-body);
      padding: var(--spacing-xl);
    }
    
    .select-user-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .select-user-card h1 {
      font-size: 2rem;
      margin-bottom: 4px;
      letter-spacing: -0.025em;
    }
    
    .select-user-card .tagline {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 40px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    .select-user-card h2 {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-lg);
      font-weight: 500;
    }

    .user-btn {
      display: block;
      width: 100%;
      margin-bottom: var(--spacing-md);
      padding: 16px;
      font-size: 1rem;
      border-radius: var(--radius-sm);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-md);
      }
      
      .app-nav {
        gap: var(--spacing-md);
      }
      
      .view-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .form-container, .select-user-card {
        padding: var(--spacing-lg);
      }
      
      .card-header-left {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- SELECT USER VIEW -->
  <div id="view-select-user" class="hidden">
    <div class="select-user-card">
      <h1>AskBack</h1>
      <div class="tagline">Ask. Recall. Answer.</div>
      <h2>Select User</h2>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Lakshya')">Lakshya</button>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Archita')">Archita</button>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="app-shell" class="hidden">
    
    <header class="app-header">
      <div class="container">
        <div class="header-top">
          <div class="brand-area">
            <h1>AskBack</h1>
            <div class="tagline">Ask. Recall. Answer.</div>
          </div>
          <div class="user-area">
            <span id="header-current-user"></span>
            <button class="btn-text" onclick="app.switchUser()">Switch User</button>
          </div>
        </div>
        <nav class="app-nav">
          <button id="tab-pending" class="nav-tab active" onclick="app.switchView('view-pending')">
            Questions for Me <span id="nav-pending-badge" class="badge empty">...</span>
          </button>
          <button id="tab-ask" class="nav-tab" onclick="app.switchView('view-ask')">Ask a Question</button>
          <button id="tab-history" class="nav-tab" onclick="app.switchView('view-history')">Question History</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="container">
        
        <!-- PENDING QUESTIONS VIEW -->
        <div id="view-pending" class="view hidden">
          <div class="view-header">
            <h2>Questions for Me</h2>
          </div>
          <div id="pending-list" class="cards-grid"></div>
        </div>

        <!-- ASK A QUESTION VIEW -->
        <div id="view-ask" class="view hidden">
          <div class="view-header">
            <h2>Ask a Question</h2>
          </div>
          
          <div class="form-container">
            <div id="ask-success-msg" class="message success hidden">Question sent successfully!</div>
            <div id="ask-error-msg" class="message error hidden"></div>

            <div class="form-group">
              <label class="form-label">Recipient</label>
              <div id="ask-recipient" class="form-static"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="ask-subject">Subject</label>
              <select id="ask-subject" class="form-input">
                <option value="Art & Culture">Art & Culture</option>
                <option value="Ancient History">Ancient History</option>
                <option value="Medieval History">Medieval History</option>
                <option value="Modern History">Modern History</option>
                <option value="Polity">Polity</option>
                <option value="Governance">Governance</option>
                <option value="Geography">Geography</option>
                <option value="Economy">Economy</option>
                <option value="Environment">Environment</option>
                <option value="Science & Technology">Science & Technology</option>
                <option value="Society">Society</option>
                <option value="International Relations">International Relations</option>
                <option value="Current Affairs">Current Affairs</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="ask-text">Question</label>
              <textarea id="ask-text" class="form-input" placeholder="Type your question here..."></textarea>
            </div>

            <div style="text-align: right; margin-top: var(--spacing-xl);">
              <button id="btn-submit-ask" class="btn btn-primary" onclick="app.submitQuestion()">Send Question</button>
            </div>
          </div>
        </div>

        <!-- HISTORY VIEW -->
        <div id="view-history" class="view hidden">
          <div class="view-header">
            <h2>Question History</h2>
            <div class="history-filters">
              <select id="history-subject-filter" class="form-input" style="min-width: 200px;" onchange="app.renderHistory(false)">
                <option value="All">All Subjects</option>
                <option value="Art & Culture">Art & Culture</option>
                <option value="Ancient History">Ancient History</option>
                <option value="Medieval History">Medieval History</option>
                <option value="Modern History">Modern History</option>
                <option value="Polity">Polity</option>
                <option value="Governance">Governance</option>
                <option value="Geography">Geography</option>
                <option value="Economy">Economy</option>
                <option value="Environment">Environment</option>
                <option value="Science & Technology">Science & Technology</option>
                <option value="Society">Society</option>
                <option value="International Relations">International Relations</option>
                <option value="Current Affairs">Current Affairs</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div id="history-list" class="cards-grid"></div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // Reusable API JSONP Layer
    const apiLayer = {
      baseUrl: 'https://script.google.com/macros/s/AKfycbypDbQyR7Q1PG8Uz7FW3tPoUrHGnGJIIPHFyLyzeYRWrnOQtBppa0Pk7Pl5yTbeJMxG/exec',
      
      request(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random()) + '_' + Date.now();
          const script = document.createElement('script');
          
          let url = `${this.baseUrl}?action=${encodeURIComponent(action)}&callback=${callbackName}`;
          for (const key in params) {
            url += `&${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`;
          }
          
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('Request timed out after 15 seconds.'));
          }, 15000);
          
          window[callbackName] = (data) => {
            cleanup();
            if (data && data.success === false) {
              reject(new Error(data.error || data.message || 'API responded with an error.'));
            } else {
              resolve(data);
            }
          };
          
          script.onerror = () => {
            cleanup();
            reject(new Error('Network error or script blocked.'));
          };
          
          function cleanup() {
            clearTimeout(timeout);
            if (script.parentNode) script.parentNode.removeChild(script);
            delete window[callbackName];
          }
          
          script.src = url;
          document.head.appendChild(script);
        });
      }
    };

    const app = {
      currentUser: null,
      users: ["Lakshya", "Archita"],
      cachedHistory: [],
      isSubmitting: false,
      
      // Initialize application
      init() {
        const savedUser = localStorage.getItem('askback_user');
        if (savedUser && this.users.includes(savedUser)) {
          this.currentUser = savedUser;
          document.getElementById('view-select-user').classList.add('hidden');
          document.getElementById('app-shell').classList.remove('hidden');
          this.switchView('view-pending');
        } else {
          document.getElementById('app-shell').classList.add('hidden');
          document.getElementById('view-select-user').classList.remove('hidden');
        }
      },

      // Utility: HTML Escaping
      escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
          tag => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              "'": '&#39;',
              '"': '&quot;'
            }[tag] || tag)
        );
      },

      // Date Formatting
      formatDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return this.escapeHTML(dateString);
        const options = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
        return date.toLocaleDateString('en-GB', options).replace(',', ' ·');
      },

      // Data Operations (API Backend)
      getPendingCount() {
        return apiLayer.request('count', { user: this.currentUser });
      },

      getPendingQuestions() {
        return apiLayer.request('pending', { user: this.currentUser });
      },

      getHistoryData() {
        return apiLayer.request('history', { user: this.currentUser });
      },

      createQuestion(subject, text) {
        return apiLayer.request('create', {
          creator: this.currentUser,
          recipient: this.getOtherUser(),
          subject: subject,
          question: text
        });
      },

      answerQuestion(id, answerText) {
        return apiLayer.request('answer', {
          id: id,
          user: this.currentUser,
          answer: answerText
        });
      },

      getOtherUser() {
        return this.currentUser === "Lakshya" ? "Archita" : "Lakshya";
      },

      // UI Navigation
      switchView(viewId) {
        // Update tabs
        document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${viewId.replace('view-', '')}`);
        if(activeTab) activeTab.classList.add('active');

        // Update views
        document.querySelectorAll('.view').forEach(el => el.classList.add('hidden'));
        document.getElementById(viewId).classList.remove('hidden');

        this.updateHeaderState();

        if (viewId === 'view-pending') this.renderPending();
        if (viewId === 'view-ask') this.renderAsk();
        if (viewId === 'view-history') this.renderHistory(true);
      },

      selectUser(username) {
        this.currentUser = username;
        localStorage.setItem('askback_user', username);
        document.getElementById('view-select-user').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        this.switchView('view-pending');
      },

      switchUser() {
        this.currentUser = null;
        localStorage.removeItem('askback_user');
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('view-select-user').classList.remove('hidden');
      },

      async updateHeaderState() {
        if(!this.currentUser) return;
        document.getElementById('header-current-user').textContent = this.currentUser;
        
        const badge = document.getElementById('nav-pending-badge');
        try {
          const res = await this.getPendingCount();
          const count = res.count !== undefined ? res.count : (res.questions ? res.questions.length : 0);
          badge.textContent = count;
          if (count === 0) badge.classList.add('empty');
          else badge.classList.remove('empty');
        } catch (e) {
          badge.textContent = '?';
          badge.classList.add('empty');
        }
      },

      // Render Logic
      async renderPending() {
        const container = document.getElementById('pending-list');
        container.innerHTML = `<div class="empty-state">Loading your questions...</div>`;

        try {
          const res = await this.getPendingQuestions();
          const questions = res.questions || [];
          container.innerHTML = '';

          if (questions.length === 0) {
            container.innerHTML = `<div class="empty-state">You have no pending questions. Excellent!</div>`;
            return;
          }

          questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const questionBody = q.question || q.text || '';
            const dateStr = q.createdAt || q.timestamp || q.date;
            
            card.innerHTML = `
              <div class="card-header">
                <div class="card-header-left">
                  <span class="badge-subject">${this.escapeHTML(q.subject)}</span>
                  <span class="card-meta">From ${this.escapeHTML(q.creator)} &middot; ${this.formatDate(dateStr)}</span>
                </div>
              </div>
              <div class="card-body">
                <div class="question-text">${this.escapeHTML(questionBody)}</div>
              </div>
              <div id="action-area-${q.id}" class="card-actions">
                <button class="btn btn-primary" onclick="app.showAnswerBox('${q.id}')">Answer Question</button>
              </div>
            `;
            container.appendChild(card);
          });
        } catch (error) {
          container.innerHTML = `<div class="empty-state message error" style="display: block;">Failed to load questions. Please try again.</div>`;
        }
      },

      showAnswerBox(id) {
        const area = document.getElementById(`action-area-${id}`);
        area.className = 'answer-box-inline';
        area.innerHTML = `
          <label class="form-label" for="answer-input-${id}">Your Answer</label>
          <textarea class="form-input" id="answer-input-${id}" placeholder="Type your answer here..." rows="4"></textarea>
          <div id="answer-error-${id}" class="message error hidden" style="margin-top: 12px; margin-bottom: 0;"></div>
          <div class="answer-box-actions">
            <button id="btn-cancel-${id}" class="btn btn-secondary" onclick="app.renderPending()">Cancel</button>
            <button id="btn-submit-${id}" class="btn btn-primary" onclick="app.submitAnswer('${id}')">Submit Answer</button>
          </div>
        `;
        document.getElementById(`answer-input-${id}`).focus();
      },

      async submitAnswer(id) {
        const text = document.getElementById(`answer-input-${id}`).value.trim();
        if (!text) return;

        const btnSubmit = document.getElementById(`btn-submit-${id}`);
        const btnCancel = document.getElementById(`btn-cancel-${id}`);
        const errorMsg = document.getElementById(`answer-error-${id}`);
        
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Submitting...';
        btnCancel.disabled = true;
        errorMsg.classList.add('hidden');

        try {
          await this.answerQuestion(id, text);
          this.updateHeaderState();
          this.renderPending();
        } catch (error) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Submit Answer';
          btnCancel.disabled = false;
          errorMsg.textContent = error.message;
          errorMsg.classList.remove('hidden');
        }
      },

      renderAsk() {
        document.getElementById('ask-recipient').textContent = this.getOtherUser();
        document.getElementById('ask-subject').selectedIndex = 0;
        document.getElementById('ask-text').value = '';
        document.getElementById('ask-success-msg').classList.add('hidden');
        document.getElementById('ask-error-msg').classList.add('hidden');
      },

      async submitQuestion() {
        if (this.isSubmitting) return;

        const subject = document.getElementById('ask-subject').value;
        const text = document.getElementById('ask-text').value.trim();
        
        if (!text) return;

        this.isSubmitting = true;
        const btnSubmit = document.getElementById('btn-submit-ask');
        const successMsg = document.getElementById('ask-success-msg');
        const errorMsg = document.getElementById('ask-error-msg');
        
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Sending...';
        successMsg.classList.add('hidden');
        errorMsg.classList.add('hidden');

        try {
          await this.createQuestion(subject, text);
          
          document.getElementById('ask-text').value = '';
          document.getElementById('ask-subject').selectedIndex = 0;
          
          successMsg.classList.remove('hidden');
          setTimeout(() => successMsg.classList.add('hidden'), 4000);
          
          this.updateHeaderState();
        } catch (error) {
          errorMsg.textContent = error.message;
          errorMsg.classList.remove('hidden');
        } finally {
          this.isSubmitting = false;
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Send Question';
        }
      },

      async renderHistory(fetchNew = true) {
        const container = document.getElementById('history-list');
        const filter = document.getElementById('history-subject-filter').value;
        
        if (fetchNew) {
          container.innerHTML = `<div class="empty-state">Loading history...</div>`;
          try {
            const res = await this.getHistoryData();
            this.cachedHistory = res.questions || [];
          } catch (error) {
            container.innerHTML = `<div class="empty-state message error" style="display: block;">Failed to load history. Please try again.</div>`;
            return;
          }
        }

        let history = this.cachedHistory;

        if (filter !== "All") {
          history = history.filter(q => q.subject === filter);
        }

        container.innerHTML = '';

        if (history.length === 0) {
          container.innerHTML = `<div class="empty-state">No questions found for this subject.</div>`;
          return;
        }

        history.forEach(q => {
          const isAnswered = q.status === 'Answered';
          const badgeClass = isAnswered ? 'answered' : 'pending';
          
          const questionBody = q.question || q.text || '';
          const answerBody = q.answer || q.answerText || '';
          const dateStr = q.createdAt || q.timestamp || q.date;

          let html = `
            <div class="card">
              <div class="card-header">
                <div class="card-header-left">
                  <span class="badge-subject">${this.escapeHTML(q.subject)}</span>
                  <span class="card-meta">${this.escapeHTML(q.creator)} &rarr; ${this.escapeHTML(q.recipient)} &middot; ${this.formatDate(dateStr)}</span>
                </div>
                <span class="status-badge ${badgeClass}">${this.escapeHTML(q.status)}</span>
              </div>
              <div class="card-body">
                <div class="question-text">${this.escapeHTML(questionBody)}</div>
          `;

          if (isAnswered && answerBody) {
            html += `
                <div class="answer-display">
                  <div class="answer-label">Answer</div>
                  <div class="answer-text">${this.escapeHTML(answerBody)}</div>
                </div>
            `;
          }

          html += `
              </div>
            </div>`;
          container.innerHTML += html;
        });
      }
    };

    // Boot app
    app.init();
  </script>
</body>
</html>
