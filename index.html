<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AskBack - Ask. Recall. Answer.</title>
  <style>
    /* 
      Premium Academic Study Tool Theme
      Clean, minimal, high-readability with generous whitespace and soft geometry.
    */
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      
      --brand-primary: #1e293b;
      --brand-hover: #0f172a;
      
      --border-light: #e2e8f0;
      --border-focus: #94a3b8;
      
      --status-success-bg: #f0fdf4;
      --status-success-text: #166534;
      
      --status-pending-bg: #fffbeb;
      --status-pending-text: #b45309;

      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      
      --transition-fast: 0.15s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .hidden {
      display: none !important;
    }

    /* Layout */
    #app-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      padding: 0 var(--spacing-lg);
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--text-primary);
      line-height: 1.3;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      margin-bottom: var(--spacing-md);
    }
    
    h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--spacing-sm);
    }

    /* Header & Navigation */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: var(--shadow-sm);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-md) 0;
    }

    .brand-area {
      display: flex;
      flex-direction: column;
    }

    .brand-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .brand-area .tagline {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .app-nav {
      display: flex;
      gap: var(--spacing-xl);
      overflow-x: auto;
      scrollbar-width: none;
    }
    
    .app-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      padding: var(--spacing-md) 0;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover:not(:disabled) {
      color: var(--text-primary);
    }

    .nav-tab.active {
      color: var(--brand-primary);
      border-bottom-color: var(--brand-primary);
      font-weight: 600;
    }

    .badge-nav {
      background: var(--brand-primary);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 9px;
    }
    .badge-nav.empty {
      background: var(--border-light);
      color: var(--text-secondary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      cursor: pointer;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: var(--brand-primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--brand-hover);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-light);
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: var(--bg-subtle);
    }
    
    .btn-danger {
      background-color: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-danger:hover:not(:disabled) {
      background-color: #fee2e2;
    }
    
    .btn-text {
      background: none;
      border: none;
      color: var(--text-secondary);
      padding: 0;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .btn-text:hover:not(:disabled) {
      color: var(--text-primary);
    }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-xl);
      padding: var(--spacing-lg);
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    /* Layouts */
    .main-content {
      flex-grow: 1;
      padding: var(--spacing-xl) 0 64px 0;
    }

    .section-block {
      margin-bottom: var(--spacing-xl);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: var(--spacing-lg);
    }
    
    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: var(--spacing-lg);
      flex-wrap: wrap;
      gap: var(--spacing-md);
    }

    /* Cards */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      padding-bottom: var(--spacing-sm);
      border-bottom: 1px solid var(--border-light);
    }

    .card-header h4 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0;
    }
    
    .card-meta {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: var(--spacing-sm);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .badge-pending {
      background-color: var(--status-pending-bg);
      color: var(--status-pending-text);
      border-color: #fde68a;
      cursor: pointer;
    }
    .badge-pending:hover {
      background-color: #fef3c7;
    }
    .badge-answered {
      background-color: var(--status-success-bg);
      color: var(--status-success-text);
      border-color: #bbf7d0;
    }
    .badge-subject {
      color: var(--brand-primary);
      background-color: var(--bg-subtle);
      border-color: var(--border-light);
    }

    /* Goal Lists */
    .goal-list {
      list-style: none;
      margin-bottom: var(--spacing-md);
      flex-grow: 1;
    }

    .goal-item {
      display: flex;
      align-items: flex-start;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
      font-size: 0.9375rem;
      transition: color var(--transition-fast);
    }

    .goal-checkbox {
      width: 16px;
      height: 16px;
      margin-top: 4px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--status-success-text);
    }
    
    .goal-checkbox:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .checkbox-mock {
      width: 16px;
      height: 16px;
      border: 1px solid var(--text-tertiary);
      border-radius: 4px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .goal-item.completed {
      color: var(--text-secondary);
      text-decoration: line-through;
      text-decoration-color: var(--border-light);
    }

    /* Stats Block */
    .stats-block {
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      padding: var(--spacing-md);
      margin-top: auto;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: var(--spacing-xs);
      font-size: 0.875rem;
    }
    .stat-row:last-child { margin-bottom: 0; }

    .stat-label { color: var(--text-secondary); font-weight: 500; }
    .stat-value { font-weight: 600; color: var(--text-primary); }
    
    .note-text {
      margin-top: var(--spacing-sm);
      font-size: 0.875rem;
      color: var(--text-secondary);
      font-style: italic;
      border-left: 2px solid var(--border-light);
      padding-left: var(--spacing-sm);
      white-space: pre-wrap;
    }

    /* Form Elements */
    .form-group { margin-bottom: var(--spacing-md); }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--spacing-xs);
    }
    .form-input {
      width: 100%;
      font-family: inherit;
      padding: 10px 14px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      transition: border-color var(--transition-fast);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--brand-primary);
    }
    textarea.form-input {
      resize: vertical;
      min-height: 100px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: var(--spacing-md);
    }
    .modal-content {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-lg);
    }
    .modal-header h2 { margin-bottom: 0; }
    
    .dynamic-list-item {
      display: flex;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }
    .dynamic-list-item input { flex-grow: 1; }

    /* QEX Answer Box */
    .answer-box {
      margin-top: var(--spacing-md);
      padding-top: var(--spacing-md);
      border-top: 1px solid var(--border-light);
    }
    .answer-display {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background-color: var(--bg-subtle);
      border-left: 3px solid var(--border-light);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 0.9375rem;
      white-space: pre-wrap;
    }

    /* Utilities */
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-tertiary);
      font-size: 0.9375rem;
      font-weight: 500;
      border: 1px dashed var(--border-light);
      border-radius: var(--radius-sm);
    }
    .loading-state {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-secondary);
      font-size: 1rem;
    }
    
    .message {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: var(--spacing-md);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .message.success {
      background-color: var(--status-success-bg);
      color: var(--status-success-text);
      border: 1px solid #bbf7d0;
    }
    .message.error {
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    /* User Selection Screen */
    #view-select-user {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-body);
      padding: var(--spacing-xl);
    }
    
    .select-user-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 48px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }
    .user-btn {
      display: block;
      width: 100%;
      margin-bottom: var(--spacing-md);
      padding: 16px;
      font-size: 1rem;
      border-radius: var(--radius-sm);
    }

    @media (max-width: 640px) {
      .header-top { flex-direction: column; align-items: flex-start; gap: var(--spacing-md); }
      .quick-actions { flex-direction: column; }
      .quick-actions .btn { width: 100%; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- SELECT USER VIEW -->
  <div id="view-select-user" class="hidden">
    <div class="select-user-card">
      <h1 style="font-size: 2rem; letter-spacing: -0.025em; margin-bottom: 4px;">AskBack</h1>
      <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 40px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500;">Ask. Recall. Answer.</div>
      <h2 style="font-size: 1rem; color: var(--text-secondary); font-weight: 500;">Who is studying today?</h2>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Lakshya')">Lakshya</button>
      <button class="btn btn-secondary user-btn" onclick="app.selectUser('Archita')">Archita</button>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="app-shell" class="hidden">
    
    <header class="app-header">
      <div class="container">
        <div class="header-top">
          <div class="brand-area">
            <h1>AskBack</h1>
            <div class="tagline">Ask. Recall. Answer.</div>
          </div>
          <div class="user-area">
            <span id="header-current-user"></span>
            <button class="btn-text" onclick="app.switchUser()">Switch User</button>
          </div>
        </div>
        <nav class="app-nav">
          <button id="nav-dashboard" class="nav-tab active" onclick="app.switchView('dashboard')">Dashboard</button>
          <button id="nav-goals" class="nav-tab" onclick="app.switchView('goals')">Daily Goals</button>
          <button id="nav-qex" class="nav-tab" onclick="app.switchView('qex')">
            Question Exchange <span id="nav-qex-badge" class="badge-nav empty">0</span>
          </button>
          <button id="nav-history" class="nav-tab" onclick="app.switchView('history')">History</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div class="container">

        <!-- GLOBAL MESSAGES -->
        <div id="global-msg" class="message hidden"></div>
        <div id="global-loading" class="loading-state hidden">Loading...</div>

        <!-- ========================================== -->
        <!-- VIEW: DASHBOARD -->
        <!-- ========================================== -->
        <div id="view-dashboard" class="view hidden">
          <!-- QUICK ACTIONS -->
          <div class="quick-actions">
            <button class="btn btn-primary" onclick="app.openGoalsModal()">Set Tomorrow's Goals</button>
            <button class="btn btn-secondary" onclick="app.openLogModal()">Log Today's Study</button>
            <button class="btn btn-secondary" onclick="app.switchView('qex')">Ask a Question</button>
            <button class="btn btn-secondary" onclick="app.switchView('qex')">Answer Pending Questions</button>
          </div>
          
          <div id="dashboard-content">
            <!-- TODAY SECTION -->
            <div class="section-block">
              <h2>Today's Overview</h2>
              <h3 id="dash-today-date"></h3>
              <div class="grid-2" id="dash-today-grid"></div>
            </div>

            <!-- TOMORROW SECTION -->
            <div class="section-block" style="margin-top: 48px;">
              <h2>Tomorrow's Plan</h2>
              <h3 id="dash-tomorrow-date"></h3>
              <div class="grid-2" id="dash-tomorrow-grid"></div>
            </div>
          </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW: DAILY GOALS (Management) -->
        <!-- ========================================== -->
        <div id="view-goals" class="view hidden">
          <div class="view-header">
            <h2>My Daily Goals</h2>
            <div style="display: flex; gap: var(--spacing-sm);">
               <button class="btn btn-secondary" onclick="app.openLogModal()">Edit Study Log</button>
               <button class="btn btn-primary" onclick="app.openGoalsModal()">Edit Tomorrow's Goals</button>
            </div>
          </div>
          
          <div id="goals-content">
            <div class="grid-2">
              <div class="section-block">
                <h3>Today</h3>
                <div id="goals-today-card"></div>
              </div>
              <div class="section-block">
                <h3>Tomorrow</h3>
                <div id="goals-tomorrow-card"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW: QUESTION EXCHANGE -->
        <!-- ========================================== -->
        <div id="view-qex" class="view hidden">
          <div class="grid-2">
            
            <!-- PENDING QUESTIONS -->
            <div class="section-block">
              <h2>Questions for Me</h2>
              <div id="qex-pending-list"></div>
            </div>

            <!-- ASK A QUESTION -->
            <div class="section-block">
              <h2>Ask a Question</h2>
              <div class="card">
                <div id="qex-ask-msg" class="message hidden"></div>
                <div class="form-group">
                  <label class="form-label">Recipient</label>
                  <div id="qex-ask-recipient" style="padding: 8px 0; font-weight: 500;"></div>
                </div>
                <div class="form-group">
                  <label class="form-label">Subject</label>
                  <select id="qex-ask-subject" class="form-input">
                    <option value="Art & Culture">Art & Culture</option>
                    <option value="Ancient History">Ancient History</option>
                    <option value="Medieval History">Medieval History</option>
                    <option value="Modern History">Modern History</option>
                    <option value="Polity">Polity</option>
                    <option value="Governance">Governance</option>
                    <option value="Geography">Geography</option>
                    <option value="Economy">Economy</option>
                    <option value="Environment">Environment</option>
                    <option value="Science & Technology">Science & Technology</option>
                    <option value="Society">Society</option>
                    <option value="International Relations">International Relations</option>
                    <option value="Current Affairs">Current Affairs</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Question</label>
                  <textarea id="qex-ask-text" class="form-input" placeholder="Type your question..."></textarea>
                </div>
                <div style="text-align: right;">
                  <button id="btn-submit-qex" class="btn btn-primary" onclick="app.submitQuestion()">Send Question</button>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- ========================================== -->
        <!-- VIEW: HISTORY -->
        <!-- ========================================== -->
        <div id="view-history" class="view hidden">
          <div class="view-header">
            <h2>Question History</h2>
            <select id="history-filter" class="form-input" style="max-width: 250px;" onchange="app.renderHistory(false)">
                <option value="All">All Subjects</option>
                <option value="Art & Culture">Art & Culture</option>
                <option value="Ancient History">Ancient History</option>
                <option value="Medieval History">Medieval History</option>
                <option value="Modern History">Modern History</option>
                <option value="Polity">Polity</option>
                <option value="Governance">Governance</option>
                <option value="Geography">Geography</option>
                <option value="Economy">Economy</option>
                <option value="Environment">Environment</option>
                <option value="Science & Technology">Science & Technology</option>
                <option value="Society">Society</option>
                <option value="International Relations">International Relations</option>
                <option value="Current Affairs">Current Affairs</option>
                <option value="Other">Other</option>
            </select>
          </div>
          <div id="history-list" style="display: flex; flex-direction: column; gap: var(--spacing-md);"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- ========================================== -->
  <!-- MODAL: SET TOMORROW'S GOALS -->
  <!-- ========================================== -->
  <div id="modal-goals" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Tomorrow's Goals</h2>
        <button class="btn-text" onclick="app.closeModals()">Close</button>
      </div>
      <h3 id="modal-goals-date" style="margin-bottom: var(--spacing-lg);"></h3>
      
      <div id="modal-goals-msg" class="message hidden"></div>
      
      <div id="goals-input-container" style="margin-bottom: var(--spacing-md);"></div>
      
      <button class="btn btn-secondary" style="width: 100%; margin-bottom: var(--spacing-lg);" onclick="app.addGoalInput()">+ Add Goal</button>
      
      <div style="text-align: right;">
        <button id="btn-save-goals" class="btn btn-primary" onclick="app.saveGoals()">Save Tomorrow's Goals</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- MODAL: LOG TODAY'S STUDY -->
  <!-- ========================================== -->
  <div id="modal-log" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Log Today's Study</h2>
        <button class="btn-text" onclick="app.closeModals()">Close</button>
      </div>
      <h3 id="modal-log-date" style="margin-bottom: var(--spacing-lg);"></h3>
      
      <div id="modal-log-msg" class="message hidden"></div>

      <div class="form-group">
        <label class="form-label">Study Hours</label>
        <input type="number" id="log-hours" class="form-input" min="0" max="24" step="0.5" placeholder="e.g., 6.5">
      </div>
      <div class="form-group">
        <label class="form-label">Completion Note (Optional)</label>
        <textarea id="log-note" class="form-input" placeholder="How did today go?"></textarea>
      </div>
      
      <div style="text-align: right;">
        <button id="btn-save-log" class="btn btn-primary" onclick="app.saveLog()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Reusable API JSONP Layer
    const apiLayer = {
      baseUrl: 'https://script.google.com/macros/s/AKfycbwZdsLkAtPNy7oA5X8UyOHgqctSigR0Vb635Dac3lrSE69AfucLOKrhALKLGUDcL3nV/exec',
      
      request(action, params = {}) {
        return new Promise((resolve, reject) => {
          const callbackName = 'jsonp_cb_' + Math.round(1000000 * Math.random()) + '_' + Date.now();
          const script = document.createElement('script');
          
          let url = `${this.baseUrl}?action=${encodeURIComponent(action)}&callback=${callbackName}`;
          for (const key in params) {
            url += `&${encodeURIComponent(key)}=${encodeURIComponent(params[key])}`;
          }
          
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error('Request timed out after 15 seconds.'));
          }, 15000);
          
          window[callbackName] = (data) => {
            cleanup();
            if (data && data.success === false) {
              reject(new Error(data.error || data.message || 'API responded with an error.'));
            } else {
              resolve(data);
            }
          };
          
          script.onerror = () => {
            cleanup();
            reject(new Error('Network error or script blocked.'));
          };
          
          function cleanup() {
            clearTimeout(timeout);
            if (script.parentNode) script.parentNode.removeChild(script);
            delete window[callbackName];
          }
          
          script.src = url;
          document.head.appendChild(script);
        });
      }
    };

    const app = {
      currentUser: null,
      users: ["Lakshya", "Archita"],
      
      // Caches
      currentDashboardData: null,
      pendingCounts: { Lakshya: 0, Archita: 0 },
      cachedHistory: [],
      cachedPending: [],
      
      init() {
        const savedUser = localStorage.getItem('askback_user');
        if (savedUser && this.users.includes(savedUser)) {
          this.currentUser = savedUser;
          this.showApp();
        } else {
          this.showSelectUser();
        }
      },

      /* --- UTILS --- */
      escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, 
          tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
      },
      getLocalDateString(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`; // YYYY-MM-DD
      },
      formatDateFriendly(dateString) {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if(parts.length !== 3) return this.escapeHTML(dateString);
        const date = new Date(parts[0], parts[1]-1, parts[2]);
        if (isNaN(date.getTime())) return this.escapeHTML(dateString);
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        return date.toLocaleDateString('en-GB', options);
      },
      formatDateTime(isoString) {
        if(!isoString) return '';
        const d = new Date(isoString);
        if(isNaN(d.getTime())) return this.escapeHTML(isoString);
        return d.toLocaleDateString('en-GB', {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}).replace(',', ' ·');
      },
      getOtherUser() {
        return this.currentUser === "Lakshya" ? "Archita" : "Lakshya";
      },
      showMsg(elementId, text, isError = false) {
        const el = document.getElementById(elementId);
        el.textContent = text;
        el.className = `message ${isError ? 'error' : 'success'}`;
        el.classList.remove('hidden');
        if(!isError) setTimeout(() => el.classList.add('hidden'), 4000);
      },

      /* --- NAVIGATION --- */
      showSelectUser() {
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('view-select-user').classList.remove('hidden');
      },
      showApp() {
        document.getElementById('view-select-user').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');
        document.getElementById('header-current-user').textContent = this.currentUser;
        this.switchView('dashboard');
      },
      selectUser(username) {
        this.currentUser = username;
        localStorage.setItem('askback_user', username);
        this.showApp();
      },
      switchUser() {
        this.currentUser = null;
        localStorage.removeItem('askback_user');
        this.showSelectUser();
      },
      async switchView(viewId) {
        // Update Tabs
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const activeTab = document.getElementById(`nav-${viewId}`);
        if(activeTab) activeTab.classList.add('active');

        // Hide all views
        document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
        document.getElementById('global-msg').classList.add('hidden');

        // Show global loading
        const globalLoad = document.getElementById('global-loading');
        globalLoad.classList.remove('hidden');

        try {
          if (viewId === 'dashboard') {
            await this.fetchDashboardData();
            this.renderDashboard();
          } else if (viewId === 'goals') {
            if(!this.currentDashboardData) await this.fetchDashboardData();
            this.renderGoalsView();
          } else if (viewId === 'qex') {
            await this.loadQex();
          } else if (viewId === 'history') {
            await this.loadHistory();
          }
          document.getElementById(`view-${viewId}`).classList.remove('hidden');
        } catch(e) {
          this.showMsg('global-msg', 'Failed to load data: ' + e.message, true);
        } finally {
          globalLoad.classList.add('hidden');
        }
      },
      updateNavBadge() {
        const badge = document.getElementById('nav-qex-badge');
        const count = this.pendingCounts[this.currentUser] || 0;
        badge.textContent = count;
        if (count > 0) badge.classList.remove('empty');
        else badge.classList.add('empty');
      },

      /* --- DASHBOARD / SHARED DATA FETCHING --- */
      async fetchDashboardData() {
        const [dashRes, lakshyaCountRes, architaCountRes] = await Promise.all([
          apiLayer.request('dashboard'),
          apiLayer.request('count', { user: 'Lakshya' }),
          apiLayer.request('count', { user: 'Archita' })
        ]);
        this.currentDashboardData = dashRes.dashboard;
        this.pendingCounts = {
          Lakshya: lakshyaCountRes.count || 0,
          Archita: architaCountRes.count || 0
        };
        this.updateNavBadge();
      },

      /* --- RENDER DASHBOARD --- */
      renderDashboard() {
        const data = this.currentDashboardData;
        document.getElementById('dash-today-date').textContent = this.formatDateFriendly(data.today.date);
        document.getElementById('dash-tomorrow-date').textContent = this.formatDateFriendly(data.tomorrow.date);
        
        const todayGrid = document.getElementById('dash-today-grid');
        const tomorrowGrid = document.getElementById('dash-tomorrow-grid');
        todayGrid.innerHTML = '';
        tomorrowGrid.innerHTML = '';

        this.users.forEach(user => {
          todayGrid.innerHTML += this.buildTodayCard(user, data.today.users[user], this.pendingCounts[user]);
          tomorrowGrid.innerHTML += this.buildTomorrowCard(user, data.tomorrow.users[user]);
        });
      },

      /* --- RENDER GOALS VIEW --- */
      renderGoalsView() {
        const data = this.currentDashboardData;
        const todayContainer = document.getElementById('goals-today-card');
        const tomorrowContainer = document.getElementById('goals-tomorrow-card');
        
        todayContainer.innerHTML = this.buildTodayCard(this.currentUser, data.today.users[this.currentUser], this.pendingCounts[this.currentUser]);
        tomorrowContainer.innerHTML = this.buildTomorrowCard(this.currentUser, data.tomorrow.users[this.currentUser]);
      },

      /* --- CARD BUILDERS --- */
      buildTodayCard(user, data, pendingCount) {
        const isMe = (user === this.currentUser);
        const badgeHtml = (pendingCount > 0 && isMe)
          ? `<div class="badge badge-pending" onclick="app.switchView('qex')">${pendingCount} Pending Questions</div>` 
          : '';

        let goalsHtml = '<div class="empty-state">No goals set for today.</div>';
        if (data.goals && data.goals.length > 0) {
          goalsHtml = '<ul class="goal-list">';
          data.goals.forEach(g => {
            const isCompCls = g.completed ? 'completed' : '';
            const isChkAttr = g.completed ? 'checked' : '';
            // Only current user can click checkboxes
            const disabledAttr = isMe ? '' : 'disabled';
            
            goalsHtml += `
              <li id="goal-item-${g.id}" class="goal-item ${isCompCls}">
                <input type="checkbox" id="goal-chk-${g.id}" class="goal-checkbox" ${isChkAttr} ${disabledAttr}
                       onchange="app.toggleGoal('${g.id}', '${user}', this.checked)">
                <span>${this.escapeHTML(g.goal)}</span>
              </li>
            `;
          });
          goalsHtml += '</ul>';
        }

        const studyHours = data.studyHours !== null ? `${data.studyHours} hrs` : '--';
        const noteHtml = data.note ? `<div class="note-text">"${this.escapeHTML(data.note)}"</div>` : '';

        return `
          <div class="card" style="height: 100%;">
            <div class="card-header">
              <h4>${user}</h4>
              ${badgeHtml}
            </div>
            ${goalsHtml}
            <div class="stats-block">
              <div class="stat-row">
                <span class="stat-label">Goals Completed</span>
                <span class="stat-value" id="stats-completed-${user}">${data.completion.completed} / ${data.completion.total}</span>
              </div>
              <div class="stat-row">
                <span class="stat-label">Study Hours</span>
                <span class="stat-value">${studyHours}</span>
              </div>
              ${noteHtml}
            </div>
            <div id="goal-error-${user}" class="message error hidden" style="margin-top: 12px;"></div>
          </div>
        `;
      },

      buildTomorrowCard(user, data) {
        let goalsHtml = '<div class="empty-state">No goals set for tomorrow yet.</div>';
        let targetCount = 0;
        
        if (data.goals && data.goals.length > 0) {
          targetCount = data.goals.length;
          goalsHtml = '<ul class="goal-list">';
          data.goals.forEach(g => {
            goalsHtml += `
              <li class="goal-item" style="color: var(--text-secondary);">
                <div class="checkbox-mock" style="border-style: dashed;"></div>
                <span>${this.escapeHTML(g.goal)}</span>
              </li>
            `;
          });
          goalsHtml += '</ul>';
        }

        return `
          <div class="card" style="height: 100%;">
            <div class="card-header">
              <h4>${user}</h4>
              <span style="font-size: 0.875rem; color: var(--text-secondary); font-weight: 500;">
                ${targetCount} Target${targetCount !== 1 ? 's' : ''}
              </span>
            </div>
            ${goalsHtml}
          </div>
        `;
      },

      /* --- TOGGLE GOAL --- */
      async toggleGoal(goalId, cardUser, isCompleted) {
        if(cardUser !== this.currentUser) return; // safety
        
        const chk = document.getElementById(`goal-chk-${goalId}`);
        const listItem = document.getElementById(`goal-item-${goalId}`);
        const errorDiv = document.getElementById(`goal-error-${cardUser}`);
        const statsSpan = document.getElementById(`stats-completed-${cardUser}`);

        chk.disabled = true;
        if (errorDiv) errorDiv.classList.add('hidden');

        try {
          await apiLayer.request('completeGoal', {
            id: goalId,
            user: this.currentUser, 
            completed: String(isCompleted)
          });

          // Optimistically update cache
          if (this.currentDashboardData && this.currentDashboardData.today.users[cardUser]) {
            const userData = this.currentDashboardData.today.users[cardUser];
            const targetGoal = userData.goals.find(g => g.id === goalId);
            if (targetGoal) targetGoal.completed = isCompleted;
            
            const completedCount = userData.goals.filter(g => g.completed).length;
            userData.completion.completed = completedCount;
            if (statsSpan) statsSpan.textContent = `${completedCount} / ${userData.completion.total}`;
          }

          if (isCompleted) listItem.classList.add('completed');
          else listItem.classList.remove('completed');
        } catch (error) {
          chk.checked = !isCompleted; 
          if (errorDiv) {
            errorDiv.textContent = error.message;
            errorDiv.classList.remove('hidden');
          }
        } finally {
          chk.disabled = false;
        }
      },

      /* --- MODALS --- */
      closeModals() {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
      },

      // Set Tomorrow's Goals
      openGoalsModal() {
        document.getElementById('modal-goals-msg').classList.add('hidden');
        document.getElementById('modal-goals-date').textContent = "For " + this.formatDateFriendly(this.getLocalDateString(1));
        
        const container = document.getElementById('goals-input-container');
        container.innerHTML = '';
        
        // Load existing
        let existing = [];
        if(this.currentDashboardData && this.currentDashboardData.tomorrow.users[this.currentUser]) {
           existing = this.currentDashboardData.tomorrow.users[this.currentUser].goals;
        }
        
        if (existing.length > 0) {
          existing.forEach(g => this.addGoalInput(g.goal));
        } else {
          this.addGoalInput('');
        }
        
        document.getElementById('modal-goals').classList.remove('hidden');
      },
      addGoalInput(val = '') {
        const container = document.getElementById('goals-input-container');
        const div = document.createElement('div');
        div.className = 'dynamic-list-item';
        div.innerHTML = `
          <input type="text" class="form-input goal-input-field" placeholder="Enter goal..." value="${this.escapeHTML(val)}">
          <button class="btn btn-danger" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
      },
      async saveGoals() {
        const btn = document.getElementById('btn-save-goals');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        
        try {
          const inputs = document.querySelectorAll('.goal-input-field');
          let goals = [];
          inputs.forEach(inp => {
            const val = inp.value.trim();
            if(val) goals.push(val);
          });
          
          if(goals.length === 0) throw new Error("Please add at least one goal.");

          await apiLayer.request('saveGoals', {
            user: this.currentUser,
            date: this.getLocalDateString(1), // Tomorrow
            goals: JSON.stringify(goals)
          });
          
          this.closeModals();
          // Refresh current view (either Dashboard or Goals)
          const activeView = document.querySelector('.nav-tab.active').id.replace('nav-', '');
          this.switchView(activeView);
          
        } catch (error) {
          this.showMsg('modal-goals-msg', error.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = "Save Tomorrow's Goals";
        }
      },

      // Log Today's Study
      openLogModal() {
        document.getElementById('modal-log-msg').classList.add('hidden');
        document.getElementById('modal-log-date').textContent = "For " + this.formatDateFriendly(this.getLocalDateString(0));
        
        const hInput = document.getElementById('log-hours');
        const nInput = document.getElementById('log-note');
        hInput.value = '';
        nInput.value = '';
        
        // Load existing
        if(this.currentDashboardData && this.currentDashboardData.today.users[this.currentUser]) {
           const currentData = this.currentDashboardData.today.users[this.currentUser];
           if(currentData.studyHours !== null) hInput.value = currentData.studyHours;
           if(currentData.note) nInput.value = currentData.note;
        }

        document.getElementById('modal-log').classList.remove('hidden');
      },
      async saveLog() {
        const btn = document.getElementById('btn-save-log');
        const hours = document.getElementById('log-hours').value;
        const note = document.getElementById('log-note').value;
        
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          if(hours === '') throw new Error("Study hours are required.");
          
          await apiLayer.request('saveLog', {
            user: this.currentUser,
            date: this.getLocalDateString(0), // Today
            studyHours: hours,
            note: note
          });
          
          this.closeModals();
          const activeView = document.querySelector('.nav-tab.active').id.replace('nav-', '');
          this.switchView(activeView);
        } catch (error) {
          this.showMsg('modal-log-msg', error.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = "Save";
        }
      },

      /* --- QUESTION EXCHANGE --- */
      async loadQex() {
        document.getElementById('qex-ask-recipient').textContent = this.getOtherUser();
        document.getElementById('qex-ask-subject').selectedIndex = 0;
        document.getElementById('qex-ask-text').value = '';
        document.getElementById('qex-ask-msg').classList.add('hidden');
        
        const listEl = document.getElementById('qex-pending-list');
        listEl.innerHTML = '<div class="loading-state">Loading pending questions...</div>';
        
        const res = await apiLayer.request('pending', { user: this.currentUser });
        this.cachedPending = res.questions || [];
        
        // Update nav badge to match accurate count
        this.pendingCounts[this.currentUser] = this.cachedPending.length;
        this.updateNavBadge();
        
        this.renderPendingQex();
      },
      renderPendingQex() {
        const listEl = document.getElementById('qex-pending-list');
        if(this.cachedPending.length === 0) {
          listEl.innerHTML = '<div class="empty-state">You have no pending questions.</div>';
          return;
        }
        
        let html = '<div style="display: flex; flex-direction: column; gap: var(--spacing-md);">';
        this.cachedPending.forEach(q => {
          html += `
            <div class="card" id="q-card-${q.id}">
              <div class="card-meta">
                <span class="badge badge-subject">${this.escapeHTML(q.subject)}</span>
                <span>From ${this.escapeHTML(q.creator)} &middot; ${this.formatDateTime(q.createdAt)}</span>
              </div>
              <div style="font-size: 1.125rem; font-weight: 500; margin-bottom: var(--spacing-md); white-space: pre-wrap;">${this.escapeHTML(q.question)}</div>
              
              <div id="qex-answer-area-${q.id}">
                 <button class="btn btn-primary" onclick="app.showAnswerBox('${q.id}')">Answer</button>
              </div>
            </div>
          `;
        });
        html += '</div>';
        listEl.innerHTML = html;
      },
      async submitQuestion() {
        const btn = document.getElementById('btn-submit-qex');
        const subject = document.getElementById('qex-ask-subject').value;
        const text = document.getElementById('qex-ask-text').value.trim();
        
        if(!text) return;
        
        btn.disabled = true;
        btn.textContent = 'Sending...';
        
        try {
          await apiLayer.request('create', {
            creator: this.currentUser,
            recipient: this.getOtherUser(),
            subject: subject,
            question: text
          });
          
          document.getElementById('qex-ask-text').value = '';
          document.getElementById('qex-ask-subject').selectedIndex = 0;
          this.showMsg('qex-ask-msg', 'Question sent successfully!');
          
        } catch (e) {
          this.showMsg('qex-ask-msg', e.message, true);
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Question';
        }
      },
      showAnswerBox(id) {
        const area = document.getElementById(`qex-answer-area-${id}`);
        area.innerHTML = `
          <div class="answer-box">
            <textarea id="qex-ans-text-${id}" class="form-input" placeholder="Type your answer here..."></textarea>
            <div id="qex-ans-msg-${id}" class="message hidden" style="margin-top: 8px;"></div>
            <div style="text-align: right; margin-top: 8px;">
               <button class="btn btn-secondary" onclick="app.renderPendingQex()">Cancel</button>
               <button id="qex-ans-btn-${id}" class="btn btn-primary" onclick="app.submitAnswer('${id}')">Submit Answer</button>
            </div>
          </div>
        `;
        document.getElementById(`qex-ans-text-${id}`).focus();
      },
      async submitAnswer(id) {
        const text = document.getElementById(`qex-ans-text-${id}`).value.trim();
        if(!text) return;
        
        const btn = document.getElementById(`qex-ans-btn-${id}`);
        btn.disabled = true;
        btn.textContent = 'Submitting...';
        
        try {
          await apiLayer.request('answer', {
            id: id,
            user: this.currentUser,
            answer: text
          });
          
          // Remove from local cache and re-render
          this.cachedPending = this.cachedPending.filter(q => q.id !== id);
          this.pendingCounts[this.currentUser] = this.cachedPending.length;
          this.updateNavBadge();
          this.renderPendingQex();
          
        } catch(e) {
          this.showMsg(`qex-ans-msg-${id}`, e.message, true);
          btn.disabled = false;
          btn.textContent = 'Submit Answer';
        }
      },

      /* --- HISTORY --- */
      async loadHistory() {
        const listEl = document.getElementById('history-list');
        listEl.innerHTML = '<div class="loading-state">Loading history...</div>';
        document.getElementById('history-filter').selectedIndex = 0;
        
        const res = await apiLayer.request('history', { user: this.currentUser });
        this.cachedHistory = res.questions || [];
        this.renderHistory(true);
      },
      renderHistory(isInitial = false) {
        const filter = document.getElementById('history-filter').value;
        const listEl = document.getElementById('history-list');
        
        let displayData = this.cachedHistory;
        if(filter !== 'All') {
          displayData = displayData.filter(q => q.subject === filter);
        }

        if(displayData.length === 0) {
          listEl.innerHTML = '<div class="empty-state">No questions found.</div>';
          return;
        }

        let html = '';
        displayData.forEach(q => {
          const isAns = q.status === 'Answered';
          const badgeClass = isAns ? 'badge-answered' : 'badge-pending';
          
          html += `
            <div class="card">
              <div class="card-header" style="border: none; padding: 0; margin-bottom: var(--spacing-sm);">
                <div class="card-meta" style="margin: 0;">
                  <span class="badge badge-subject">${this.escapeHTML(q.subject)}</span>
                  <span>${this.escapeHTML(q.creator)} &rarr; ${this.escapeHTML(q.recipient)}</span>
                  <span>&middot; ${this.formatDateTime(q.createdAt)}</span>
                </div>
                <span class="badge ${badgeClass}">${this.escapeHTML(q.status)}</span>
              </div>
              <div style="font-size: 1.0625rem; font-weight: 500; white-space: pre-wrap;">${this.escapeHTML(q.question)}</div>
          `;
          
          if(isAns && q.answer) {
             html += `
               <div class="answer-display">
                 <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 4px;">Answer</div>
                 <div>${this.escapeHTML(q.answer)}</div>
               </div>
             `;
          }
          html += '</div>';
        });
        
        listEl.innerHTML = html;
      }

    };

    // Boot app
    app.init();
  </script>
</body>
</html>
